[project]
name = "mobidesk-pro"
version = "1.0.1"
description = "Gestion de stock des afficheurs de téléphones"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "SQLAlchemy>=2.0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pyinstaller>=6.10.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
